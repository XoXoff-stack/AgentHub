name: Publish release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to build (for example v1.0.0)
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Windows
            os: windows-latest
            artifact: windows-installers
            files: src-tauri/target/release/bundle/nsis/*.exe
          - platform: Linux
            os: ubuntu-24.04
            artifact: linux-installers
            files: |
              src-tauri/target/release/bundle/appimage/*.AppImage
              src-tauri/target/release/bundle/deb/*.deb
          - platform: macOS
            os: macos-latest
            artifact: macos-installers
            files: src-tauri/target/release/bundle/dmg/*.dmg
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl wget file libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf libwebkit2gtk-4.1-dev \
            libgtk-3-dev libglib2.0-dev pkg-config

      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund

      - name: Install Rust stable
        shell: bash
        run: |
          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          fi
          "$HOME/.cargo/bin/rustup" toolchain install stable --profile minimal
          "$HOME/.cargo/bin/rustup" default stable
          "$HOME/.cargo/bin/rustup" component add rustfmt clippy --toolchain stable

      - name: Build release bundles
        run: npm run tauri -- build

      - name: Upload installers
        uses: actions/upload-artifact@v7.0.0
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.files }}
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - name: Download all installers
        uses: actions/download-artifact@v8.0.2
        with:
          path: release-assets
          merge-multiple: true

      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          if gh release view "$EVENT_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$EVENT_TAG" release-assets/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$EVENT_TAG" release-assets/* \
              --repo "$GITHUB_REPOSITORY" \
              --title "AgentHub $EVENT_TAG" \
              --generate-notes
          fi
