name: Publish release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to build (for example v1.0.0)
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Windows
            os: windows-latest
            artifact: windows-installers
            files: src-tauri/target/release/bundle/nsis/*.exe
          - platform: Linux
            os: ubuntu-24.04
            artifact: linux-installers
            files: |
              src-tauri/target/release/bundle/appimage/*.AppImage
              src-tauri/target/release/bundle/deb/*.deb
          - platform: macOS
            os: macos-latest
            artifact: macos-installers
            files: src-tauri/target/release/bundle/dmg/*.dmg

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl wget file libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf libwebkit2gtk-4.1-dev \
            libgtk-3-dev libglib2.0-dev pkg-config

      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund

      - name: Install Rust stable
        shell: bash
        run: |
          set -euo pipefail

          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          fi

          if ! command -v rustup >/dev/null 2>&1; then
            echo "rustup could not be found after installation" >&2
            exit 1
          fi

          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.cargo/bin:$PATH"

          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup component add rustfmt clippy --toolchain stable

          rustup show active-toolchain
          rustc --version
          cargo --version

      - name: Build release bundles
        run: npm run tauri -- build

      - name: Upload installers
        uses: actions/upload-artifact@v7.0.0
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.files }}
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-24.04

    steps:
      - name: Download all installers
        uses: actions/download-artifact@v8.0.2
        with:
          path: release-assets
          merge-multiple: true

      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail

          if [ -z "$EVENT_TAG" ]; then
            echo "No release tag was provided." >&2
            exit 1
          fi

          if [ ! -d release-assets ]; then
            echo "The release-assets directory was not created." >&2
            exit 1
          fi

          mapfile -d '' -t ASSETS < <(find release-assets -type f -print0 | sort -z)

          if [ "${#ASSETS[@]}" -eq 0 ]; then
            echo "No installer files were downloaded." >&2
            exit 1
          fi

          echo "Files to publish:"
          printf ' - %s\n' "${ASSETS[@]}"

          if gh release view "$EVENT_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$EVENT_TAG" "${ASSETS[@]}" \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
          else
            gh release create "$EVENT_TAG" "${ASSETS[@]}" \
              --repo "$GITHUB_REPOSITORY" \
              --title "AgentHub $EVENT_TAG" \
              --generate-notes
          fi
